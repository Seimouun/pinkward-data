name: Matches sammeln

on:
  schedule:
    # GitHub lässt geplante Starts unter Last ausfallen (am 15.11. liefen von 5 Terminen nur einer, fast
    # 2 Stunden zu spät). Darum zweimal pro Stunde anstoßen, nie zur vollen Stunde; der Job "due"
    # entscheidet, ob wirklich gecrawlt wird. So kostet ein ausgefallener Start höchstens 30 Minuten.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Wie viele Minuten Matches laden"
        default: "45"

# Nie zwei Läufe gleichzeitig, sonst überschreibt einer die Datenbank des anderen.
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: data
  # Pause zwischen zwei Uploads, bevor der nächste Crawl startet. Ein Crawl dauert etwa eine Stunde,
  # zusammen also etwa alle 3 Stunden neue Daten.
  PAUSE_MINUTES: 120

jobs:
  # Geplante Starts crawlen nur, wenn der letzte Upload alt genug ist und nicht der Server crawlt
  # (CRAWL_ON_GITHUB=false); manuelle Starts immer.
  # Läuft gerade ein Crawl, wartet dieser Lauf (concurrency) und sieht danach den frischen Upload.
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manuell gestartet."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Läuft der Dauer-Crawler auf dem Server (deploy/), die Repo-Variable CRAWL_ON_GITHUB auf false setzen:
          # Sonst crawlen zwei Rechner mit einem Key und überschreiben sich gegenseitig das Release.
          if [ "${{ vars.CRAWL_ON_GITHUB }}" = "false" ]; then
            echo "CRAWL_ON_GITHUB=false: Der Server crawlt, hier nichts zu tun."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          updated=$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | select(.name == "matchups.json") | .updated_at' 2>/dev/null || true)
          if [ -z "$updated" ]; then
            echo "Noch kein Upload gefunden, Crawl startet."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( ($(date +%s) - $(date -d "$updated" +%s)) / 60 ))
          if [ "$age" -ge "$PAUSE_MINUTES" ]; then
            echo "Letzter Upload vor $age Minuten, Crawl startet."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Letzter Upload vor $age Minuten (Pause $PAUSE_MINUTES), diesmal kein Crawl."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  crawl:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      RIOT_PLATFORM: ${{ vars.RIOT_PLATFORM || 'euw1' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      # Die Daten liegen als Parquet-Dateien (eine je Tabelle) im Release; daraus wird die
      # Arbeitsdatenbank gebaut. Parquet ist etwa fünfmal kleiner als eine DuckDB-Datei.
      - name: Daten vom letzten Lauf holen
        run: |
          mkdir -p data/snapshot
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -q '\.parquet$'; then
            gh release download "$RELEASE_TAG" --pattern "*.parquet" --dir data/snapshot
          else
            echo "Noch keine Daten im Release, starte leer."
            touch data/started-empty
          fi
          python -m leaguestats restore data/snapshot

      - name: Matches laden
        id: crawl
        continue-on-error: true
        run: >
          python -m leaguestats crawl --timelines --matches 100000 --no-export
          --max-minutes "${{ inputs.minutes || '45' }}"

      - name: Aufräumen, exportieren, Snapshot schreiben
        run: |
          python -m leaguestats prune --keep-patches 3
          python -m leaguestats export --out dist/matchups.json
          python -m leaguestats snapshot dist/snapshot
          python -m leaguestats status

      - name: Daten und matchups.json hochladen
        run: |
          # Schutz vor Datenverlust: Wurde leer gestartet, obwohl das Release schon Daten hat
          # (z. B. weil die Abfrage vorhin fehlschlug), nichts überschreiben.
          if [ -f data/started-empty ] && gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -q '\.parquet$'; then
            echo "::error::Leer gestartet, aber im Release liegen schon Daten. Upload abgebrochen, damit nichts verloren geht."
            exit 1
          fi
          # GitHub erlaubt höchstens 2 GB je Release-Datei.
          for file in dist/snapshot/*.parquet; do
            if [ "$(stat -c %s "$file")" -gt 1900000000 ]; then
              echo "::error::$file ist größer als 1,9 GB. Weniger Patches behalten (prune --keep-patches)."
              exit 1
            fi
          done
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --title "Daten" --latest \
                 --notes "Wird automatisch vom Workflow aktualisiert: Parquet-Dateien (Rohdaten je Tabelle) und matchups.json (für die App)."
          gh release upload "$RELEASE_TAG" dist/snapshot/*.parquet dist/matchups.json --clobber

      # GitHub pausiert Zeitpläne in öffentlichen Repos nach 60 Tagen ohne Commit.
      - name: Zeitplan wach halten
        run: |
          last_commit=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last_commit )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Zeitplan wach halten"
            git push
          fi

      - name: Fehler beim Laden melden
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "::error::Das Laden der Matches ist fehlgeschlagen, z. B. wegen eines abgelaufenen API-Keys. Bisherige Daten wurden trotzdem hochgeladen."
          exit 1
